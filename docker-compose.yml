services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myblog_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: my_blog
      DB_USERNAME: my_blog
      DB_PASSWORD: my_blog_password

  db:
    image: mysql:8.0
    container_name: myblog_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: my_blog
      MYSQL_USER: my_blog
      MYSQL_PASSWORD: my_blog_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: myblog_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
